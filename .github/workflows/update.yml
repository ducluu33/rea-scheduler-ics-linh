name: Update schedule ICS

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build schedule.ics
        env:
          GROUP: ${{ vars.GROUP || '15.27Д-БИ01/25б' }}
          END_DATE: ${{ vars.END_DATE || '2026-06-27' }}
          MAX_WEEKS: '20'
        run: npm run build

      - name: Upload REA browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-scraper-debug
          path: public/debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/schedule.ics

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update schedule $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    if: success()

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
